description:
  en:
    localisedName: "Inverum — Sovereign Enterprise ITAM, Logistics & NIS2/ISO 27001 Compliance Platform"
    genericName: "IT Asset Management, Container Logistics & Regulatory Compliance System"
    shortDescription: >
      100% air-gapped-ready European open-source IT Asset Management, physical container/rack
      hierarchy, and automated NIS2, ISO/IEC 27001:2022, GDPR & eIDAS PAdES-B-LTA compliance platform.
    longDescription: |
      Inverum is an EU-sovereign, self-hosted, multi-tenant IT Asset Management (ITAM), Data Center
      & Rack Infrastructure (DCIM), Physical Field Container Logistics, and Regulatory Compliance
      platform engineered for public administration, postal/logistics operators, hospitals, utilities,
      and NIS2 essential/important entities.

      Unlike flat spreadsheet-like inventory tools, Inverum enforces real-world physical container
      hierarchies directly in PostgreSQL (`Location -> StorageUnit/Rack -> Box -> Asset`) with O(1)
      container relocation cascades, separates serialized capital equipment (`Asset`) from bulk
      operational spares (`Supply`, `StockItem`, `Consumable`, `Accessory`), and automates the entire
      regulatory audit lifecycle.

      Every equipment handover, return, User A -> User B sanitization, and 4-eyes NIST SP 800-88
      decommission generates a deterministic PDF 1.7 record sealed with an eIDAS PAdES-B-LTA
      cryptographic signature and automated archival RFC 3161 timestamp renewal.
    features:
      - "Physical Hierarchy & O(1) Container Cascades (Location -> StorageUnit/Rack -> Sealed Box -> Asset)"
      - "16 Built-in Monthly/Periodic ISO/IEC 27001:2022 Annex A, EU NIS2 (Art. 21), and GDPR Compliance Reports"
      - "eIDAS PAdES-B-LTA Cryptographic PDF Signing & Automated Archival DocTimeStamp Renewal (10+ Year Integrity)"
      - "6 Mandatory Lifecycle SOP Checklists (Onboarding, User A -> User B Sanitization, Offboarding, External Repair, 4-Eyes EOL Disposal, Box Custody)"
      - "Zero-Dependency ISO/IEC 15417 Code128-B Barcode & ISO/IEC 18004 QR Thermal Sticker Engine (62x29mm & 100x50mm)"
      - "Dedicated Supply & Critical BCP Spares Ledger with Minimum Stock Alerts (ISO 27001 A.8.14)"
      - "100% Air-Gapped / Offline Operation with Ed25519 RFC 8032 Fair-Use Licensing & Zero External Telemetry"

  hr:
    localisedName: "Inverum — Suvereni sustav za upravljanje IT imovinom, logistikom i NIS2/ISO 27001 sukladnošću"
    genericName: "Sustav za upravljanje imovinom (ITAM), skladišnom logistikom i regulatornim dokazima"
    shortDescription: >
      100% on-prem / air-gapped europski open-source sustav za evidenciju IT opreme, transportnih kutija,
      ormara/rackova te automatizirano generiranje NIS2 (ZKS), ISO 27001:2022, GDPR i eIDAS PAdES-B-LTA dokaza.
    longDescription: |
      Inverum je europska suverena open-core platforma za upravljanje informacijskom i fizičkom imovinom,
      logistikom transportnih kutija s plombama, zalihama kritičnih rezervnih dijelova i regulatornom
      sukladnošću prema Zakonu o kibernetičkoj sigurnosti (NIS2), ISO/IEC 27001:2022, GDPR-u i eIDAS uredbi.

      Sustav u samoj PostgreSQL bazi održava fizičku hijerarhiju (`Lokacija -> Ormar/Rack -> Kutija -> Uređaj`),
      vodi obvezne SOP sigurnosne checkliste (uključujući sanitizaciju pri prijelazu opreme s korisnika A na
      korisnika B te 4-oči potvrdu brisanja kod rashoda po NIST 800-88) i automatski izrađuje te kriptografski
      potpisuje (PAdES-B-LTA) zapisnike o zaduženju/razduženju (reverse) i 16 mjesečnih ISO/NIS2 izvještaja.
    features:
      - "Fizička hijerarhija u bazi (Lokacija -> Ormar/Rack -> Transportna kutija -> Uređaj) uz O(1) prijenos lokacije"
      - "16 ugrađenih mjesečnih i periodičnih izvještaja po ISO/IEC 27001:2022 Annex A, NIS2 (ZKS) i GDPR kontrolama"
      - "eIDAS PAdES-B-LTA kriptografsko potpisivanje reversa i certifikata uz automatsku obnovu vremenskog žiga"
      - "6 životnih SOP checklista (Onboarding, Sanitizacija Korisnik A -> B, Offboarding, Vanjski servis, Rashod 4-oči, Plombirane kutije)"
      - "Deterministički SVG generator termo naljepnica s Code128 barkodom i QR kodom (62x29mm i 100x50mm)"
      - "Odvojeno praćenje serijske opreme (Asset) i količinskih zaliha/rezervnih dijelova (Supply / StockMovement)"
      - "100% Offline / Air-Gapped rad bez vanjske telemetrije uz Ed25519 provjeru licence"
